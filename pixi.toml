[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.10"
numpy = "*"
magicgui = "*"
napari = "*"
qtpy = "*"
scikit-image = "*"
bluesky-tiled-plugins = ">=2.0.0rc3"

[pypi-dependencies]
napari-tiled = { path = ".", editable = true }
tiled = { version = "*", extras = ["array", "client"] }

[environments]
default = { solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
testing = { features = ["testing"], solve-group = "default" }

[tasks]

[feature.all.pypi-dependencies]
napari-tiled = { path = ".", editable = true, extras = ["all"] }

[feature.dev.pypi-dependencies]
napari-tiled = { path = ".", editable = true, extras = ["dev"] }
napari = { extras = ["qt"] }
pyqt6 = "*"
napari-plot = { git = "https://github.com/lukasz-migas/napari-plot", tag = "v0.3.1" }

[feature.dev.tasks]
napari = "napari"

[feature.testing.pypi-dependencies]
napari-tiled = { path = ".", editable = true, extras = ["testing"] }
napari = { extras = ["qt"] }
tox = "*"
pytest = "*"
pytest-cov = "*"
pytest-qt = "*"
